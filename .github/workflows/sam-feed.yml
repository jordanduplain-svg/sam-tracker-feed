# Every morning: download SAM.gov's public daily CSV, keep the open notices and
# publish them on GitHub Pages as sam.json, the file the browser extension reads.
name: SAM.gov feed

on:
  schedule:
    - cron: "30 11 * * *" # 11:30 UTC, after SAM.gov's nightly extract
  workflow_dispatch: # "Run workflow" button, for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sam-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python tools/build_sam_feed.py --out site/sam.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
